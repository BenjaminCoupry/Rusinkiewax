[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rusinkiewax"
version = "0.1.0"
description = "JAX utilities for Rusinkiewicz parameterization"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]